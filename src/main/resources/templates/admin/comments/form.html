<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head(${pageTitle})}"></head>
<body>
<div class="app">
    <aside th:replace="~{admin/fragments/layout :: sidebar('comments')}"></aside>

    <div class="main">
        <header th:replace="~{admin/fragments/layout :: topbar}"></header>

        <main class="content">
            <h1 th:text="${pageTitle}">Thêm bình luận</h1>
            <div th:replace="~{admin/fragments/layout :: alerts}"></div>

            <form class="form-card form-wide" method="post" th:object="${commentForm}"
                  th:action="@{${commentForm.id == null ? '/admin/comments/create' : '/admin/comments/edit/' + commentForm.id}}">
                <label for="articleId">Bài viết *</label>
                <select id="articleId" th:field="*{articleId}">
                    <option value="">-- Chọn bài viết --</option>
                    <option th:each="a : ${articles}" th:value="${a.id}" th:text="${a.title}"></option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('articleId')}" th:errors="*{articleId}"></div>

                <label for="userId">Người bình luận *</label>
                <select id="userId" th:field="*{userId}">
                    <option value="">-- Chọn người dùng --</option>
                    <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.fullName}"></option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}"></div>

                <label for="content">Nội dung *</label>
                <textarea id="content" rows="6" th:field="*{content}" maxlength="2000"></textarea>
                <div class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>

                <label for="status">Trạng thái *</label>
                <select id="status" th:field="*{status}">
                    <option th:each="s : ${statuses}" th:value="${s}"
                            th:text="${s.name() == 'APPROVED'} ? 'Đã duyệt' : (${s.name() == 'PENDING'} ? 'Chờ duyệt' : 'Từ chối')"></option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Lưu</button>
                    <a class="btn btn-light" th:href="@{/admin/comments}">Hủy</a>
                </div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
