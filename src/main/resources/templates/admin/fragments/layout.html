<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - Quản trị tin tức'">Quản trị tin tức</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

<!-- Menu trái: th:replace="~{admin/fragments/layout :: sidebar('dashboard')}" -->
<aside th:fragment="sidebar(active)" class="sidebar">
    <div class="brand">
        <span class="brand-logo">T</span>
        <span class="brand-name">Tin Tức<small>Trang quản trị</small></span>
    </div>

    <div class="nav-label">Tổng quan</div>
    <nav>
        <a th:href="@{/admin/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span>Dashboard</span>
        </a>
    </nav>

    <div class="nav-label">Nội dung</div>
    <nav>
        <a th:href="@{/admin/articles}" th:classappend="${active == 'articles'} ? 'active'">
            <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span>Bài viết</span>
        </a>
        <a th:href="@{/admin/categories}" th:classappend="${active == 'categories'} ? 'active'">
            <svg class="icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span>Chuyên mục</span>
        </a>
    </nav>

    <div class="nav-label">Hệ thống</div>
    <nav>
        <a th:href="@{/admin/users}" th:classappend="${active == 'users'} ? 'active'">
            <svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>Người dùng</span>
        </a>
    </nav>
</aside>

<!-- Thanh trên: nút mở menu (điện thoại) + tên admin + đăng xuất -->
<header th:fragment="topbar" class="topbar">
    <div class="sidebar-overlay"
         onclick="document.querySelector('.app').classList.remove('sidebar-open')"></div>

    <button type="button" class="menu-toggle" aria-label="Mở menu"
            onclick="document.querySelector('.app').classList.toggle('sidebar-open')">
        <svg class="icon" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <div class="topbar-spacer"></div>

    <div class="user-chip">
        <span class="avatar"
              th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}">A</span>
        <span class="user-meta">
            <strong sec:authentication="name">admin</strong>
            <small>Quản trị viên</small>
        </span>
    </div>

    <form th:action="@{/admin/logout}" method="post" class="logout-form">
        <button type="submit" class="btn btn-light btn-icon" title="Đăng xuất">
            <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Đăng xuất</span>
        </button>
    </form>
</header>

<!-- Thông báo thành công / lỗi (dùng ở các trang CRUD) -->
<div th:fragment="alerts">
    <div class="alert alert-success" th:if="${success}">
        <span th:text="${success}"></span>
        <button type="button" class="alert-close" onclick="this.parentElement.remove()">&times;</button>
    </div>
    <div class="alert alert-error" th:if="${error}">
        <span th:text="${error}"></span>
        <button type="button" class="alert-close" onclick="this.parentElement.remove()">&times;</button>
    </div>
</div>

</body>
</html>
